[package]
name = "rustos"
version = "1.0.0"
edition = "2021"
authors = ["RustOS Core Architecture Team"]
description = "Modern Bootable Educational 32-bit Operating System in Rust"

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
